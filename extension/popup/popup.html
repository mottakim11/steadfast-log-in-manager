<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steadfast Login Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <!-- Image 3 Header -->
    <div class="popup-header">
      <h3 class="popup-title">Steadfast Login Manager</h3>
      <div class="header-right">
        <span class="dot" id="statusDot" title="Connection status"></span>
        <button id="toggleConfigBtn" class="icon-btn" title="Settings / Change Office Key">⚙</button>
      </div>
    </div>

    <!-- Setup Form (Shown if not configured or when ⚙ clicked) -->
    <div id="setupFormSection" class="config-view hidden">
      <div class="config-title">Extension Setup</div>
      <div id="setupAlert" class="alert-msg hidden"></div>
      <div class="form-group">
        <label for="popupServerUrl">Admin Server URL</label>
        <input type="url" id="popupServerUrl" placeholder="http://localhost:3000" class="input-field">
      </div>
      <div class="form-group">
        <label for="popupSecretKey">Office Secret Key</label>
        <input type="password" id="popupSecretKey" placeholder="sflm_off_..." class="input-field" autocomplete="off">
      </div>
      <button id="saveSetupBtn" class="btn-save">Connect & Save</button>
    </div>

    <!-- Main Accounts View (Image 3 Design) -->
    <div id="accountsSection" class="popup-body">
      <div class="office-name" id="officeTitleDisplay">Office Accounts</div>

      <div id="accountsContainer" class="btn-list">
        <div class="loading-state">Loading accounts...</div>
      </div>

      <div class="status-line" id="popupStatusLine">Ready</div>

      <button id="openPortalBtn" class="portal-link-btn">
        <span>Open Steadfast Moderator Portal &rarr;</span>
      </button>
    </div>

    <!-- Image 3 Footer -->
    <div class="popup-footer">
      <a href="https://wa.me/8801814163424" target="_blank" rel="noopener">
        Developed by Mottakim (01814163424)
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
