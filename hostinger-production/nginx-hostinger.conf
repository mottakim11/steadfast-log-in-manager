# Nginx Reverse Proxy Configuration for Hostinger VPS
# Save this file to: /etc/nginx/sites-available/steadfast.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/steadfast.conf /etc/nginx/sites-enabled/
# Then reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Change to your domain or VPS IP

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
